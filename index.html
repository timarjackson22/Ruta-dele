    return hit;
  }

  /* ---------- word lookup sheet ---------- */
  function lookup(word, sentIdx) {
    const w = word.toLowerCase();
    const hits = [];
    (CUR && CUR.gl || []).forEach((g) => { if (g[0].toLowerCase().split(/[\s()]+/).some((t) => t.length > 2 && (t === w || (w.length > 4 && t.slice(0, -1) === w.slice(0, -1))))) hits.push('<p><b>' + esc(g[0]) + "</b> · " + esc(g[1]) + ' <span class="pill new">glossary</span></p>'); });
    const r = FORMIDX[w];
    if (r != null) { const e = W[r]; hits.push('<p><b>' + esc(e[0]) + '</b> <span class="tag">' + e[1] + "</span> · " + esc(e[2]) + ' <span class="pill ok">#' + (r + 1) + " most used</span></p>"); }
    const sh = document.getElementById("sheet");
    sh.innerHTML = '<div class="sheet-in"><div class="row" style="justify-content:space-between"><span class="sw">' + esc(word) + '</span><button class="btn small" data-act="l-close">Close</button></div>' +
      (hits.length ? hits.join("") : '<p class="muted">Not in the glossary or the top 2,500 words. Try the base form of the word.</p>') +
      '<div class="row">' + sayBtn(word) + '<button class="btn small" data-act="l-sent" data-pi="-1" data-k="' + sentIdx + '">Play this sentence</button><button class="btn small" data-act="l-from" data-k="' + sentIdx + '">Play from here</button></div></div>';

  }

  /* ---------- 2,500 words ---------- */
  const WV = { band: 0, q: "", pos: "all", hideEn: false, hideKnown: false, quiz: null };

  const POSN = { noun: "nouns", verb: "verbs", adj: "adjectives", adv: "adverbs", pron: "pronouns", det: "determiners", prep: "prepositions", conj: "conjunctions", num: "numbers", interj: "interjections" };
  function knownIn(a, b) { let n = 0; for (let i = a; i < b; i++) if (S.w[i]) n++; return n; }
  function wordsView() {
    const total = knownIn(0, W.length), pct = Math.round((total / W.length) * 100);
    const bands = []; for (let b = 0; b < W.length / BAND; b++) { const k = knownIn(b * BAND, (b + 1) * BAND); bands.push('<button class="band-chip" data-act="w-band" data-b="' + b + '" aria-pressed="' + (WV.band === b && !WV.q) + '"><b>' + (b * BAND + 1) + "–" + (b + 1) * BAND + "</b><span>" + k + " known</span></button>"); }
    app.innerHTML = '<div class="stack"><div><p class="eyebrow">Vocabulario por frecuencia</p><h1>Las 2.500 palabras</h1><p class="lead2">The 2,500 most-used Spanish words, ranked by how often they occur in real speech. The first 1,000 cover roughly 80% of everyday conversation. Learn them band by band, and mark the ones you know.</p></div>' +
      '<div class="ebar"><div><span class="muted">You know</span><b>' + total.toLocaleString("en") + " / 2,500</b><div class=\"bar\" style=\"margin-top:6px\"><i style=\"width:" + pct + '%"></i></div></div><div><span class="muted">How to study</span><p>Learn one band of 250 at a time. Hide the English, test yourself, then take the band quiz. Correct answers are marked as known.</p></div></div>' +

  function wordsBody() {
    const el = document.getElementById("wbody"); if (!el) return;

    let idx = [];
    if (q) { for (let i = 0; i < W.length && idx.length < 200; i++) { const e = W[i]; if (strip(norm(e[0])).includes(qs) || norm(e[2]).includes(q) || strip(norm(e[3])).includes(qs)) idx.push(i); } }
    else for (let i = WV.band * BAND; i < Math.min(W.length, (WV.band + 1) * BAND); i++) idx.push(i);

      idx.map((i) => { const e = W[i]; return '<tr><td class="rk">' + (i + 1) + '</td><td class="sp">' + sayBtn(e[0].split(",")[0]) + '</td><td><b>' + esc(e[0]) + '</b> <span class="tag">' + e[1] + "</span>" + (e[3] ? '<small class="forms">' + esc(e[3]) + "</small>" : "") + '</td><td class="gl"><span data-act="reveal">' + esc(e[2]) + '</span></td><td><button class="kn" data-act="w-known" data-i="' + i + '" aria-pressed="' + !!S.w[i] + '" aria-label="Mark ' + esc(e[0]) + ' as known">✓</button></td></tr>'; }).join("") +

      '<div class="row">' + (Z.answered ? '<button class="btn primary" data-act="w-next">Next</button>' : "") + '<button class="btn" data-act="w-quiz-exit">Stop quiz</button></div></div>';

  /* ---------- events for listening and words ---------- */

  });
  document.addEventListener("change", (e) => {
    if (e.target.id === "pl-rate") { PL.rate = parseFloat(e.target.value); if (PL.playing) plJump(PL.i); }

  });
  let wt = null;
  document.addEventListener("input", (e) => { if (e.target.id === "w-search") { WV.q = e.target.value; clearTimeout(wt); wt = setTimeout(wordsBody, 150); } });
  function speakAt(text) {
    if (!canSpeak) return;
    try { speechSynthesis.cancel(); PL.playing = false; plUI(); const u = new SpeechSynthesisUtterance(text); u.lang = voice ? voice.lang : "es-ES"; if (voice) u.voice = voice; u.rate = Math.min(PL.rate, 0.85); speechSynthesis.speak(u); } catch (err) {}
  }

  /* ---------- router ---------- */
  function route() {

    else {

      const L = LV[m[1]]; navChips(L.id);

      else if (m[3] === "exam") exam(L);

  }
  window.addEventListener("hashchange", route);

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]"); if (!t) return;
    const act = t.dataset.act;
    const m = location.hash.replace(/^#/, "").match(/^(a1|a2|b1|b2|c1|c2)(?:-u(\d+))?/);
    const L = m ? LV[m[1]] : null, ui = m && m[2] ? parseInt(m[2], 10) - 1 : null;
    if (act === "say") { e.stopPropagation(); speak(t.dataset.t); }
    else if (act === "jump") { const el = document.getElementById("s-" + t.dataset.to); if (el) el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); }
    else if (act === "hide-en") { const on = app.classList.toggle("hide-en"); t.setAttribute("aria-pressed", on); t.textContent = on ? "Show translations" : "Hide translations to test yourself"; app.querySelectorAll(".shown").forEach((s) => s.classList.remove("shown")); }
    else if (act === "reveal") t.classList.toggle("shown");
    else if (act === "play-dlg" && L) { const lines = L.units[ui].d.l.map((l) => l[1]); try { speechSynthesis.cancel(); lines.forEach((ln) => { const u = new SpeechSynthesisUtterance(ln); u.lang = voice ? voice.lang : "es-ES"; if (voice) u.voice = voice; u.rate = 0.9; speechSynthesis.speak(u); }); } catch (err) {} }
    else if (act === "show-ans" && L) check(L, ui, true);
    else if (act === "reset-ex" && L) { app.querySelectorAll(".ex input").forEach((x) => { x.value = ""; x.className = ""; }); app.querySelectorAll(".fb").forEach((x) => { x.textContent = ""; x.className = "fb"; }); document.getElementById("res").textContent = ""; }
    else if (act === "toggle-done" && L) { const k = uKey(L.id, ui); const st = S.u[k] || {}; st.done = !st.done; S.u[k] = st; save(); navChips(L.id); t.textContent = st.done ? "Done ✓" : "Mark as done"; t.setAttribute("aria-pressed", st.done); }
    else if (act === "mc") {
      const list = t.closest(".mc"); const scope = list.dataset.scope; const qi = +t.dataset.q, oi = +t.dataset.o;
      if (scope === "lq" || !L) return;
      const qs =scope === "mock" ? L.mock : L.units[ui].r.q; const right = qs[qi][2];
      const btns = t.parentElement.querySelectorAll(".opt"); if (btns[0].disabled) return;
      btns.forEach((b, j) => { b.disabled = true; if (j === right) b.classList.add("right"); });
      if (oi !== right) t.classList.add("wrong");
      const answered = list.querySelectorAll(".opt.right").length;
      if (answered === qs.length) {
        const score = qs.length - list.querySelectorAll(".opt.wrong").length;
        if (scope === "mock") { S.m[L.id] = Math.max(S.m[L.id] || 0, score); save(); const r = document.getElementById("mres"); if (r) r.textContent = "Score: " + score + " / " + qs.length + (score >= 8 ? " · Ready for official model exams" : " · Review the units you missed, then try again"); }
      }
    }
    else if (act === "mock-reset" && L) mock(L);
    else if (act === "flip") { FC.flipped = !FC.flipped; cardsView(LV[FC.l]); }
    else if (act === "fc-rev") { FC.rev = !FC.rev; FC.flipped = false; cardsView(LV[FC.l]); }
    else if (act === "fc-new") { FC.onlyNew = !FC.onlyNew; FC.order = null; FC.flipped = false; cardsView(LV[FC.l]); }
    else if (act === "fc-shuffle") { const o = FC.order || []; for (let a = o.length - 1; a > 0; a--) { const b = Math.floor(Math.random() * (a + 1)); [o[a], o[b]] = [o[b], o[a]]; } FC.pos = 0; FC.flipped = false; cardsView(LV[FC.l]); }
    else if (act === "fc-again") { FC.pos++; FC.flipped = false; cardsView(LV[FC.l]); }
    else if (act === "fc-know") { const arr = S.k[FC.l] || []; if (FC.cur && !arr.includes(FC.cur.id)) arr.push(FC.cur.id); S.k[FC.l] = arr; save(); if (!FC.onlyNew) FC.pos++; FC.flipped = false; cardsView(LV[FC.l]); }
    else if (act === "fc-reset") { if (!FC.armReset) { FC.armReset = true; cardsView(LV[FC.l]); setTimeout(() => { if (FC && FC.armReset) { FC.armReset = false; if (/-cards$/.test(location.hash)) cardsView(LV[FC.l]); } }, 4000); } else { S.k[FC.l] = []; save(); FC.armReset = false; FC.order = null; cardsView(LV[FC.l]); } }
  });
  document.addEventListener("change", (e) => { if (e.target.id === "fc-unit") { FC.unit = e.target.value; FC.order = null; FC.flipped = false; cardsView(LV[FC.l]); } });
  document.addEventListener("keydown", (e) => {
    if (!/-cards$/.test(location.hash) || !FC || e.target.matches("input, select")) return;
    if (e.key === " " || e.key === "Enter") { if (e.target.closest(".fc") || e.target === document.body) { e.preventDefault(); FC.flipped = !FC.flipped; cardsView(LV[FC.l]); } }
    else if (e.key === "ArrowRight") { FC.pos++; FC.flipped = false; cardsView(LV[FC.l]); }
  });

  route();
})();
</script>
