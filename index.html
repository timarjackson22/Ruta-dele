<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4FA3">
<meta name="description" content="Curso de español A1–C2 para el DELE: vocabulario con audio, gramática, ejercicios, historias, pódcast y las 2.500 palabras más usadas.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ruta DELE">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; font: 14px system-ui, -apple-system, sans-serif }
img { max-width: 100% }
[hidden] { display: none !important }
</style>
<title>Ruta DELE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;0,800;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
/* Layout: sticky level bar, single reading column (max 980px), azulejo tile pattern as the one decorative motif */
:root {
  --bg: #F2F4F8; --surface: #FFFFFF; --surface-2: #E8EDF5; --ink: #141B2D; --muted: #56607A; --line: #D6DDEA;
  --cobalt: #1F4FA3; --on-cobalt: #FFFFFF; --saffron: #E0A01A; --saffron-soft: #FBEFD2;
  --good: #2C7449; --good-soft: #E0F0E6; --bad: #B03636; --bad-soft: #F7E1E1; --warn: #8A5D00;
  --tile-a: #1F4FA3; --tile-b: #E0A01A; --tile-c: #F2F4F8;
  --display: "Alegreya", Georgia, "Times New Roman", serif;
  --body: "Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1322; --surface: #151D31; --surface-2: #1D2741; --ink: #E7ECF6; --muted: #9EA9C2;
  --line: #2A3653; --cobalt: #86A9F0; --on-cobalt: #0D1322; --saffron: #F0BA45; --saffron-soft: #382C12;
  --good: #6EC793; --good-soft: #15301F; --bad: #F08C8C; --bad-soft: #3A1C21; --warn: #F0BA45;
  --tile-a: #2A5AB5; --tile-b: #E0A01A; --tile-c: #0D1322; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0D1322; --surface: #151D31; --surface-2: #1D2741; --ink: #E7ECF6; --muted: #9EA9C2;
  --line: #2A3653; --cobalt: #86A9F0; --on-cobalt: #0D1322; --saffron: #F0BA45; --saffron-soft: #382C12;
  --good: #6EC793; --good-soft: #15301F; --bad: #F08C8C; --bad-soft: #3A1C21; --warn: #F0BA45;
  --tile-a: #2A5AB5; --tile-b: #E0A01A; --tile-c: #0D1322; color-scheme: dark }

* { box-sizing: border-box }
html { -webkit-text-size-adjust: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--cobalt) }
button { font: inherit; color: inherit }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; border-radius: 4px }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; line-height: 1.15; margin: 0 }
h1 { font-size: clamp(2rem, 5vw, 3rem); font-weight: 800 }
h2 { font-size: 1.6rem; font-weight: 700 }
h3 { font-size: 1.25rem; font-weight: 700 }
p { margin: 0 }
.wrap { max-width: 980px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; flex-wrap: wrap }
.brand { font-family: var(--display); font-weight: 800; font-size: 1.3rem; text-decoration: none; color: var(--ink); display: flex; align-items: center; gap: 8px; margin-right: auto }
.brand i { width: 22px; height: 22px; border-radius: 4px; display: inline-block }
.lvls { display: flex; gap: 6px; flex-wrap: wrap }
.lvl-chip { text-decoration: none; color: var(--ink); font-weight: 700; font-size: .9rem; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); position: relative; font-variant-numeric: tabular-nums }
.lvl-chip[aria-current="true"] { background: var(--cobalt); color: var(--on-cobalt); border-color: var(--cobalt) }
.lvl-chip.done::after { content: ""; position: absolute; right: -2px; top: -2px; width: 9px; height: 9px; border-radius: 50%; background: var(--good); border: 2px solid var(--surface) }

/* azulejo motif */
.tiles { background-color: var(--tile-a);
  background-image: radial-gradient(circle at 50% 50%, var(--tile-b) 0 13%, transparent 14%),
    radial-gradient(circle at 0 0, var(--tile-c) 0 24%, transparent 25%), radial-gradient(circle at 100% 0, var(--tile-c) 0 24%, transparent 25%),
    radial-gradient(circle at 0 100%, var(--tile-c) 0 24%, transparent 25%), radial-gradient(circle at 100% 100%, var(--tile-c) 0 24%, transparent 25%);
  background-size: 26px 26px; }

main { padding-block: 28px 64px }
.stack { display: flex; flex-direction: column; gap: 28px }
.muted { color: var(--muted) }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.crumbs { font-size: .92rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap }
.crumbs a { text-decoration: none }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); padding: 8px 16px; border-radius: 999px; cursor: pointer; text-decoration: none; color: var(--ink); font-weight: 600; font-size: .95rem; }
.btn:hover { border-color: var(--cobalt) }
.btn.primary { background: var(--cobalt); color: var(--on-cobalt); border-color: var(--cobalt) }
.btn.small { padding: 4px 12px; font-size: .88rem }
.btn[aria-pressed="true"] { background: var(--surface-2); border-color: var(--cobalt) }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center }
.say { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; cursor: pointer; flex: none; color: var(--cobalt) }
.say:hover { background: var(--saffron-soft) }
.say svg { width: 16px; height: 16px }
.no-tts .say, .no-tts .tts-only { display: none !important }

/* home */
.hero { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 32px; align-items: start }
.hero .lead { font-size: 1.15rem; max-width: 34em; margin-top: 12px }
.stats { display: flex; gap: 24px; flex-wrap: wrap; margin-top: 18px; font-variant-numeric: tabular-nums }
.stats b { display: block; font-family: var(--display); font-size: 1.7rem; line-height: 1 }
.stats span { font-size: .85rem; color: var(--muted) }
.route { list-style: none; margin: 0; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: flex; flex-direction: column; gap: 0 }
.route li { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; position: relative; padding-block: 7px }
.route li:not(:last-child)::before { content: ""; position: absolute; left: 21px; top: 34px; height: calc(100% - 20px); width: 3px; background: var(--line) }
.route li.full:not(:last-child)::before { background: var(--good) }
.station { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-family: var(--display); border: 3px solid var(--line); background: var(--surface); position: relative; z-index: 1; text-decoration: none; color: var(--ink) }
.route li.started .station { border-color: var(--cobalt) }
.route li.full .station { border-color: var(--good); background: var(--good-soft) }
.route .nm { font-weight: 600; min-width: 0 }
.route .nm small { display: block; color: var(--muted); font-weight: 400 }
.route .pct { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem }
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column }
.lcard .band { height: 72px; position: relative }
.lcard .code { position: absolute; left: 16px; bottom: -18px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px 12px; font-family: var(--display); font-weight: 800; font-size: 1.6rem }
.lcard .body { padding: 28px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1 }
.lcard .meta { font-size: .88rem; color: var(--muted); font-variant-numeric: tabular-nums }
.lcard .go { margin-top: auto }
.bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 999px }
.steps { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; counter-reset: s; list-style: none; padding: 0; margin: 0 }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; counter-increment: s }
.steps li::before { content: counter(s); font-family: var(--display); font-weight: 800; color: var(--saffron); font-size: 1.4rem; display: block; line-height: 1 }
.steps b { display: block; margin-top: 4px }
.steps span { font-size: .9rem; color: var(--muted) }

/* level page */
.lhead { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 22px; align-items: center }
.lhead .badge { width: 120px; height: 120px; border-radius: 14px; display: grid; place-items: center }
.lhead .badge b { background: var(--surface); border-radius: 10px; padding: 4px 14px; font-family: var(--display); font-size: 2.2rem; font-weight: 800 }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto }
.tabs a { padding: 10px 14px; text-decoration: none; color: var(--muted); font-weight: 600; border-bottom: 3px solid transparent; white-space: nowrap }
.tabs a[aria-current="page"] { color: var(--ink); border-color: var(--saffron) }
.ulist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px }
.ulist a { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; text-decoration: none; color: var(--ink) }
.ulist a:hover { border-color: var(--cobalt) }
.ulist .n { font-family: var(--display); font-weight: 800; font-size: 1.4rem; color: var(--cobalt); font-variant-numeric: tabular-nums }
.ulist .t { font-weight: 700; font-size: 1.05rem; min-width: 0 }
.ulist .t small { display: block; font-weight: 400; color: var(--muted); font-size: .92rem }
.pill { font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; font-variant-numeric: tabular-nums }
.pill.new { background: var(--surface-2); color: var(--muted) }
.pill.prog { background: var(--saffron-soft); color: var(--warn) }
.pill.ok { background: var(--good-soft); color: var(--good) }

/* unit page */
.jump { display: flex; gap: 8px; flex-wrap: wrap }
section.block { display: flex; flex-direction: column; gap: 14px }
.shead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 6px }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface) }
table { border-collapse: collapse; width: 100%; font-size: .98rem }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: middle }
th { background: var(--surface-2); font-size: .82rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted) }
tr:last-child td { border-bottom: 0 }
td:first-child { font-weight: 600 }
.vocab td.es { font-weight: 700; width: 46% }
.vocab td.sp { width: 44px; padding-right: 0 }
.hide-en .vocab td.en span { filter: blur(6px); cursor: pointer; user-select: none }
.hide-en .vocab td.en span.shown { filter: none }
.gblock { display: flex; flex-direction: column; gap: 10px }
.rule { font-style: italic; color: var(--muted) }
.notes { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px }
.notes li { padding-left: 18px; position: relative }
.notes li::before { content: ""; position: absolute; left: 2px; top: .62em; width: 7px; height: 7px; background: var(--saffron); transform: rotate(45deg) }
.dlg { display: flex; flex-direction: column; gap: 8px }
.line { display: flex; gap: 10px; align-items: flex-start; max-width: 640px; padding: 10px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line) }
.line.b { align-self: flex-end; background: var(--surface-2) }
.line .who { font-weight: 700; color: var(--cobalt) }
.line .tr { display: block; color: var(--muted); font-size: .9rem; font-style: italic }
.passage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; max-width: 65ch }
.ex { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 20px; counter-reset: q }
.ex li { counter-increment: q; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 4px 10px; align-items: start }
.ex li::before { content: counter(q); font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px }
.ex .q { min-width: 0 }
.blank { display: inline-block; min-width: 3em; border-bottom: 2px solid var(--muted); height: 1em; vertical-align: baseline }
.ex input { grid-column: 2; width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit }
.ex input.ok { border-color: var(--good); background: var(--good-soft) }
.ex input.no { border-color: var(--bad); background: var(--bad-soft) }
.ex input.near { border-color: var(--saffron); background: var(--saffron-soft) }
.fb { grid-column: 2; font-size: .9rem; min-height: 0 }
.fb.ok { color: var(--good) } .fb.no { color: var(--bad) } .fb.near { color: var(--warn) }
.result { font-weight: 700; font-size: 1.05rem; font-variant-numeric: tabular-nums }
.unav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 18px }

/* multiple choice */
.mc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 16px; counter-reset: m }
.mc > li { counter-increment: m; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px }
.mc .mq { font-weight: 600; margin-bottom: 10px }
.mc .mq::before { content: counter(m) ". "; color: var(--muted) }
.opts { display: flex; gap: 8px; flex-wrap: wrap }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 14px; cursor: pointer }
.opt:hover:not(:disabled) { border-color: var(--cobalt) }
.opt.right { background: var(--good-soft); border-color: var(--good); color: var(--good); font-weight: 700 }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); text-decoration: line-through }
.opt:disabled { cursor: default }

/* flashcards */
.fc-wrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; justify-items: center }
.fc { width: min(100%, 520px); min-height: 230px; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; text-align: center; padding: 28px 20px; cursor: pointer; position: relative }
.fc .face { font-family: var(--display); font-size: clamp(1.6rem, 5vw, 2.3rem); font-weight: 700; line-height: 1.2 }
.fc .hint { position: absolute; bottom: 12px; left: 0; right: 0; font-size: .85rem; color: var(--muted) }
.fc.flipped { background: var(--surface-2) }
.fc .say { position: absolute; top: 12px; right: 12px }
.fc-tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink) }

/* exam */
.ebar { display: flex; gap: 12px; flex-wrap: wrap }
.ebar div { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; flex: 1 1 200px }
.ebar b { display: block; font-family: var(--display); font-size: 1.4rem }
.tests { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.test { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px }
.test .tmeta { display: flex; gap: 6px; flex-wrap: wrap }
.test h4 { margin: 4px 0 0; font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
.model { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px }
.task { background: var(--ink); color: var(--bg); border-radius: var(--r); padding: 12px 16px; grid-column: 1 / -1 }
.mtext { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; white-space: pre-line; font-size: 1.02rem }
.callout { background: var(--saffron-soft); border-radius: var(--r); padding: 12px 16px; font-size: .95rem }

@media (max-width: 820px) {
  .hero { grid-template-columns: minmax(0, 1fr) }
  .levels { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)) }
  .tests, .model { grid-template-columns: minmax(0, 1fr) }
  .ex { grid-template-columns: minmax(0, 1fr) }
}
@media (max-width: 540px) {
  .levels, .steps { grid-template-columns: minmax(0, 1fr) }
  .lhead { grid-template-columns: 72px minmax(0, 1fr); gap: 14px }
  .lhead .badge { width: 72px; height: 72px }
  .lhead .badge b { font-size: 1.4rem; padding: 2px 8px }
  .lvls { width: 100% }
  .vocab td.es { width: auto }
}
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width .4s ease } .fc { transition: background .2s } }

/* sections nav + phone tab bar */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.small { font-size: .88rem }
.secnav { display: flex; gap: 4px }
.secnav a { text-decoration: none; color: var(--muted); font-weight: 700; padding: 6px 12px; border-radius: 8px }
.secnav a[aria-current="page"] { color: var(--ink); background: var(--surface-2) }
.tabbar { display: none }
.lead2 { font-size: 1.1rem; max-width: 60ch; margin-top: 8px }
.features { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
.feature { display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 14px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; text-decoration: none; color: var(--ink) }
.feature:hover { border-color: var(--cobalt) }
.feature .ic { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; background: var(--cobalt); color: var(--on-cobalt) }
.feature .ic svg { width: 28px; height: 28px }
.feature b { font-family: var(--display); font-size: 1.25rem; display: block }

/* listening */
.lgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px }
.lcard2 { display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; text-decoration: none; color: var(--ink); min-height: 150px }
.lcard2:hover { border-color: var(--cobalt) }
.lcard2 b { font-family: var(--display); font-size: 1.2rem }
.lcard2 .row { justify-content: space-between }
.kind { font-size: .75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase }
.kind.sto { color: var(--cobalt) } .kind.pod { color: var(--warn) }
.howto { margin: 0; padding-left: 1.3em; display: grid; gap: 2px; color: var(--muted) }
.story { max-width: 68ch; display: flex; flex-direction: column; gap: 14px; font-size: 1.12rem; line-height: 1.75 }
.story .en, .pod .en { display: none; color: var(--muted); font-style: italic; font-size: .95rem; line-height: 1.5; margin-top: 4px }
.show-en .story .en, .show-en .pod .en { display: block }
.sent { border-radius: 4px; padding: 1px 0; transition: background .15s }
.sent.playing, .pline.playing .txt { background: var(--saffron-soft); box-shadow: 0 0 0 3px var(--saffron-soft) }
.w { cursor: pointer; border-radius: 3px }
.w:hover { text-decoration: underline; text-decoration-color: var(--saffron); text-underline-offset: 3px }
.hide-text .story .sent, .hide-text .pod .txt { filter: blur(7px); user-select: none; pointer-events: none }
.hide-text .story .en, .hide-text .pod .en { display: none !important }
.hosts { display: flex; gap: 10px 20px; align-items: center; flex-wrap: wrap; color: var(--muted) }
.host { display: inline-flex; gap: 8px; align-items: center; white-space: nowrap }
.av { width: 34px; height: 34px; border-radius: 50%; display: inline-grid; place-items: center; font-weight: 800; flex: none; font-family: var(--display) }

.pbtn.main { width: 50px; height: 50px; background: var(--cobalt); color: var(--on-cobalt) }
.ppos { font-variant-numeric: tabular-nums; color: var(--muted); font-size: .9rem; min-width: 52px }
.dict { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 14px }
.dict input { flex: 1 1 220px; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit }
.dfb { margin-top: 6px; line-height: 1.8 }
.dk { background: var(--good-soft); color: var(--good); border-radius: 4px; padding: 0 3px }
.dm { background: var(--bad-soft); color: var(--bad); border-radius: 4px; padding: 0 3px; text-decoration: underline }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; pointer-events: none }

.sw { font-family: var(--display); font-size: 1.6rem; font-weight: 700 }
.tag { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--surface-2); padding: 1px 6px; border-radius: 4px; vertical-align: middle }

/* words */
.bands { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px }
.band-chip { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; text-align: left; cursor: pointer; font-variant-numeric: tabular-nums }
.band-chip b { display: block }
.band-chip span { font-size: .8rem; color: var(--muted) }
.band-chip[aria-pressed="true"] { border-color: var(--cobalt); background: var(--surface-2) }
.wtools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.wtools input { flex: 1 1 220px; min-width: 0; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit }
table.words td { vertical-align: top }
table.words td:first-child { font-weight: 400 }
.rk { color: var(--muted); font-variant-numeric: tabular-nums; width: 3.5em }
.forms { display: block; color: var(--muted); font-size: .82rem }
.words td.gl { min-width: 12em }
.blur-en td.gl span { filter: blur(6px); cursor: pointer }
.blur-en td.gl span.shown { filter: none }
.kn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: transparent; cursor: pointer; font-weight: 800 }
.kn[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: var(--surface) }
.quiz { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 14px }
.quiz h2 { font-size: 2rem }
.qopts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px }
.qopts .opt { text-align: left; padding: 10px 14px }

@media (max-width: 820px) {

  main { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)) }

  .sheet { bottom: calc(66px + env(safe-area-inset-bottom, 0px)) }
  body[data-sec="escuchar"] .lvls, body[data-sec="palabras"] .lvls { display: none }
  .lgrid, .features { grid-template-columns: minmax(0, 1fr) }
  .bands { grid-template-columns: repeat(2, minmax(0, 1fr)) }
}
@media (max-width: 540px) {
  .qopts { grid-template-columns: minmax(0, 1fr) }
  .words .rk { width: 2.6em }
  .words th:nth-child(5), .words td:nth-child(5) { padding-left: 4px }
}

{ id: "historia-a2-1", type: "s", lvl: "a2", t: "Un viaje inolvidable", s: "Two siblings in Peru",
  p: ["El verano pasado, Marta y su hermano Javi fueron a Perú. Llegaron a Lima un lunes por la noche y, al día siguiente, tomaron un avión a Cuzco.",
      "Cuzco les encantó: las calles eran estrechas, las casas tenían balcones de madera y había mercados por todas partes. Pero la ciudad está a más de tres mil metros de altura y, el primer día, Javi se encontró mal. Le dolía mucho la cabeza y no quería comer.",

      "Unos días después, subieron a Machu Picchu. Cuando llegaron arriba, hacía sol y no había nubes. «Ha sido el mejor día de mi vida», dijo Marta."],
  en: ["Last summer, Marta and her brother Javi went to Peru. They arrived in Lima on a Monday night and, the next day, they took a plane to Cuzco.",

  q: [["¿Adónde fueron después de Lima?", ["A Cuzco", "A Bogotá", "A Machu Picchu"], 0], ["¿Qué le pasó a Javi el primer día?", ["Perdió la maleta", "Le dolía la cabeza", "Se cayó"], 1], ["¿Qué tiempo hacía en Machu Picchu?", ["Llovía", "Hacía sol", "Nevaba"], 1]] },
{ id: "historia-a2-2", type: "s", lvl: "a2", t: "La entrevista", s: "A race against the clock",
  p: ["Daniel se despertó a las seis, mucho antes que el despertador. Hoy tenía su primera entrevista de trabajo en una empresa de diseño y estaba muy nervioso.",

  en: ["Daniel woke up at six, long before the alarm clock. Today he had his first job interview at a design company and he was very nervous.",

  gl: [["el despertador", "alarm clock"], ["con retraso", "late, delayed"], ["ir andando", "to walk, go on foot"], ["sin aliento", "out of breath"], ["el puesto", "position, job"]],

{ id: "historia-b1-1", type: "s", lvl: "b1", t: "La carta de la abuela", s: "A letter that was never sent",
  p: ["Cuando Elena vació el piso de su abuela, encontró una caja de metal escondida detrás de los libros. Dentro había fotos en blanco y negro, un billete de tren de 1962 y una carta que nunca se había enviado.",
      "La carta estaba dirigida a un tal Andrés, que vivía en Buenos Aires. «Querido Andrés», empezaba, «espero que esta carta te llegue algún día. Si mis padres me lo permitieran, tomaría el próximo barco para estar contigo».",
      "Elena no sabía nada de aquella historia. Su abuela siempre le había contado que había conocido a su abuelo en un baile del pueblo y que nunca había salido de España.",
      "Esa noche, Elena buscó el nombre de Andrés en internet. Tardó horas, pero al final encontró a una mujer en Argentina que tenía el mismo apellido y que había publicado una foto antigua: un joven sonriente delante de una estación de tren. Era la misma estación que aparecía en las fotos de su abuela.",
      "Elena respiró hondo y empezó a escribir un mensaje: «Hola, creo que nuestras familias tienen una historia en común…»."],
  gl: [["vaciar", "to empty, clear out"], ["escondido", "hidden"], ["un tal", "a certain"], ["el baile", "dance"], ["el apellido", "surname"], ["respirar hondo", "to take a deep breath"]],
  q: [["¿Dónde encontró Elena la caja?", ["Debajo de la cama", "Detrás de los libros", "En la cocina"], 1], ["¿Por qué no se fue la abuela con Andrés?", ["Sus padres no se lo permitían", "No tenía dinero", "Andrés no la quería"], 0], ["¿Qué le había contado siempre su abuela?", ["Que había vivido en Argentina", "Que había conocido al abuelo en un baile", "Que había escrito muchas cartas"], 1], ["¿Qué hace Elena al final?", ["Llama a su madre", "Escribe un mensaje a una mujer argentina", "Quema la carta"], 1]] },
{ id: "historia-b1-2", type: "s", lvl: "b1", t: "El huerto del barrio", s: "From rubbish dump to garden",
  p: ["Hace dos años, en el barrio de Lucas había un solar abandonado lleno de basura. Los vecinos se quejaban, pero nadie hacía nada. Un día, Lucas, que es profesor de ciencias, propuso una idea en la reunión de vecinos: convertir el solar en un huerto comunitario.",
      "Al principio, muchos no estaban de acuerdo. «Es una pérdida de tiempo», decía el señor Ramírez, del tercero. «Nadie lo va a cuidar». Sin embargo, Lucas consiguió que el ayuntamiento les cediera el terreno y organizó un primer fin de semana de limpieza.",
      "Vinieron más personas de las que esperaba: familias con niños, estudiantes, jubilados. Entre todos, sacaron toneladas de basura, construyeron bancales de madera y plantaron tomates, lechugas y hierbas aromáticas.",
      "Hoy el huerto es el lugar de encuentro del barrio. Los niños del colegio vienen a aprender a cultivar y, cada septiembre, hay una fiesta de la cosecha. ¿Y el señor Ramírez? Es quien más horas pasa allí. Dice que cuidar las plantas le ha devuelto las ganas de salir de casa."],
  gl: [["el solar", "empty plot of land"], ["el huerto", "vegetable garden"], ["quejarse", "to complain"], ["ceder", "to hand over, lend"], ["el bancal", "raised bed"], ["la cosecha", "harvest"]],
  q: [["¿Qué había antes en el solar?", ["Un parque", "Basura", "Un colegio"], 1], ["¿Qué consiguió Lucas del ayuntamiento?", ["Dinero", "Que les cedieran el terreno", "Un profesor"], 1], ["¿Qué dice ahora el señor Ramírez?", ["Que es una pérdida de tiempo", "Que el huerto le ha devuelto las ganas de salir", "Que quiere vender el terreno"], 1]] },

      [0, "¿Y qué fue lo más difícil al principio?", "And what was the hardest thing at first?"],
      [1, "Sin duda, el invierno. Nunca había visto tanta nieve. Pero también me costó hacer amigos: la gente era amable, pero yo no entendía sus bromas.", "Without a doubt, the winter. I’d never seen so much snow. But making friends was also hard: people were kind, but I didn’t get their jokes."],
      [0, "Eso es muy interesante. El humor es lo último que se aprende en un idioma.", "That’s really interesting. Humour is the last thing you learn in a language."],
      [1, "Exacto. Y otra cosa: echaba muchísimo de menos la comida de mi madre.", "Exactly. And another thing: I really missed my mother’s cooking."],
      [0, "Si pudieras volver atrás, ¿lo harías otra vez?", "If you could go back, would you do it again?"],
      [1, "Sin dudarlo. Creo que todo el mundo debería vivir fuera alguna vez. Aprendes a ser paciente y a ver tu propio país con otros ojos.", "Without hesitation. I think everyone should live abroad at some point. You learn to be patient and to see your own country with different eyes."],
      [0, "Estoy de acuerdo, aunque no creo que sea fácil para todos. Depende mucho de la situación de cada persona.", "I agree, although I don’t think it’s easy for everyone. It depends a lot on each person’s situation."],
      [1, "Claro. Por eso recomiendo que, antes de irse, la gente investigue bien: el trabajo, la vivienda, el idioma…", "Of course. That’s why I recommend that people research carefully before leaving: work, housing, the language…"],
      [0, "Buenos consejos. Y tú, que nos escuchas: ¿te gustaría vivir en otro país? Piénsalo y responde en voz alta. ¡Hasta la próxima!", "Good advice. And you, listening: would you like to live in another country? Think about it and answer out loud. Until next time!"]],
  gl: [["costar (algo a alguien)", "to be hard for someone"], ["la broma", "joke"], ["echar de menos", "to miss"], ["la vivienda", "housing"]],
  q: [["¿Por qué se fue Diego a Montreal?", ["Por trabajo", "Para aprender francés y conocer otra cultura", "Por su novia"], 1], ["¿Qué le costó, además del invierno?", ["Encontrar trabajo", "Hacer amigos y entender las bromas", "Encontrar piso"], 1], ["¿Qué opina Ana?", ["Que todos deberían irse", "Que no es fácil para todo el mundo", "Que es mala idea"], 1]] },
{ id: "podcast-b1-2", type: "p", lvl: "b1", t: "Redes sociales", s: "Café con español · Episode 6",
  l: [[1, "Bienvenidos. Hoy debatimos sobre las redes sociales. Ana, ¿cuántas horas al día pasas con el móvil?", "Welcome. Today we debate social media. Ana, how many hours a day do you spend on your phone?"],
      [0, "Uf, prefiero no mirarlo… Según la aplicación, casi tres horas. Y eso que intento controlarme.", "Ugh, I’d rather not look… According to the app, almost three hours. And that’s while trying to control myself."],
      [1, "Yo uso las redes sobre todo para el trabajo. Subo fotos de los platos del restaurante y así conseguimos clientes nuevos.", "I mainly use social media for work. I post photos of the restaurant’s dishes and that way we get new customers."],
      [0, "Esa es una ventaja clara. Además, sirven para mantener el contacto con amigos que viven lejos.", "That’s a clear advantage. Also, they help you keep in touch with friends who live far away."],
      [1, "Sin embargo, también tienen inconvenientes. Mucha gente compara su vida con la de los demás y se siente mal.", "However, they also have drawbacks. Many people compare their lives with others’ and feel bad."],
      [0, "Es verdad. Y los adolescentes son los más vulnerables. Me preocupa que pasen tanto tiempo conectados.", "That’s true. And teenagers are the most vulnerable. It worries me that they spend so much time online."],
      [1, "¿Qué propones tú?", "What do you suggest?"],
      [0, "Por un lado, que los colegios enseñen a usar las redes de forma crítica. Por otro, que los padres den ejemplo.", "On the one hand, that schools teach how to use social media critically. On the other, that parents set an example."],
      [1, "Estoy de acuerdo. Yo, por ejemplo, he dejado de mirar el móvil durante las comidas.", "I agree. I, for example, have stopped looking at my phone during meals."],
      [0, "¡Muy buena idea! Fíjense en las expresiones para opinar: estoy de acuerdo, me preocupa que, por un lado, por otro.", "Very good idea! Notice the expressions for giving opinions: estoy de acuerdo, me preocupa que, por un lado, por otro."],
      [1, "¿Y tú qué opinas? Hasta la próxima.", "And what do you think? Until next time."]],
  gl: [["subir (una foto)", "to post, upload"], ["el inconveniente", "drawback"], ["dar ejemplo", "to set an example"], ["dejar de + inf.", "to stop doing"]],
  q: [["¿Para qué usa Diego las redes?", ["Para el trabajo", "Para jugar", "Para ver noticias"], 0], ["¿Qué le preocupa a Ana?", ["Que los adolescentes pasen mucho tiempo conectados", "Que su aplicación no funcione", "Que Diego no suba fotos"], 0], ["¿Qué ha dejado de hacer Diego?", ["Usar las redes", "Mirar el móvil durante las comidas", "Trabajar los domingos"], 1]] },

{ id: "historia-b2-1", type: "s", lvl: "b2", t: "El algoritmo", s: "A content moderator notices a pattern",
  p: ["Clara llevaba tres meses trabajando como moderadora de contenidos cuando notó algo extraño. Cada vez que revisaba los vídeos que el sistema marcaba como peligrosos, casi todos procedían de los mismos barrios de la ciudad.",
      "Al principio pensó que era una casualidad. Sin embargo, cuanto más analizaba los datos, más evidente le parecía el patrón: el algoritmo había aprendido a desconfiar de ciertos acentos, de ciertas calles, incluso de ciertos nombres.",
      "Se lo comentó a su supervisor, quien se encogió de hombros. «El sistema funciona; si no fuera así, nos lo habrían dicho los ingenieros». Clara insistió en que alguien revisara los criterios, pero le respondieron que no era asunto suyo.",
      "Durante semanas dudó. Si denunciaba lo que había visto, podía perder el empleo; si se callaba, seguiría participando en algo que consideraba injusto. Finalmente, recopiló ejemplos, los anonimizó con cuidado y se los envió a una periodista especializada en tecnología.",
      "El reportaje se publicó un mes más tarde. La empresa negó cualquier irregularidad, pero anunció una auditoría externa. A Clara no la despidieron, aunque tampoco la ascendieron. Cuando le preguntan si volvería a hacerlo, responde sin dudar: «Mil veces»."],
  gl: [["proceder de", "to come from"], ["la casualidad", "coincidence"], ["el patrón", "pattern"], ["encogerse de hombros", "to shrug"], ["no ser asunto de alguien", "to be none of someone’s business"], ["recopilar", "to gather, compile"]],
  q: [["¿Qué notó Clara?", ["Que los vídeos eran muy largos", "Que los vídeos marcados venían de los mismos barrios", "Que su supervisor no trabajaba"], 1], ["¿Qué le respondió el supervisor?", ["Que revisaría los criterios", "Que el sistema funcionaba", "Que la iban a ascender"], 1], ["¿Qué hizo Clara al final?", ["Dimitió", "Envió ejemplos a una periodista", "Habló con los ingenieros"], 1], ["¿Cómo reaccionó la empresa?", ["Despidió a Clara", "Anunció una auditoría externa", "Cerró el servicio"], 1]] },
{ id: "historia-b2-2", type: "s", lvl: "b2", t: "Volver al pueblo", s: "Remote work in a village of forty people",
  p: ["Cuando Marcos le dijo a su jefe que quería teletrabajar desde el pueblo de sus abuelos, en la sierra de Teruel, este se rio. «Allí no hay ni cobertura», le dijo. Tenía parte de razón: la conexión era tan lenta que, las primeras semanas, Marcos tuvo que subir a la plaza de la iglesia para enviar sus informes.",
      "El pueblo tenía cuarenta habitantes censados, aunque en invierno no quedaban ni la mitad. La tienda abría dos días por semana y el médico pasaba consulta los jueves. A Marcos, sin embargo, aquello no le pareció un inconveniente, sino un ritmo distinto al que había que acostumbrarse.",
      "Poco a poco se fue integrando. Aprendió a hacer leña, ayudó a reparar el tejado del antiguo lavadero y convenció al ayuntamiento para que solicitara una ayuda para instalar fibra óptica. Cuando por fin llegó la conexión, dos familias jóvenes se animaron a mudarse.",
      "Hoy, cinco años después, la escuela ha vuelto a abrir con siete alumnos. Marcos no se considera un héroe. «No he salvado el pueblo», insiste. «Simplemente he demostrado que se puede vivir aquí sin renunciar a nada importante»."],
  gl: [["la cobertura", "phone signal, coverage"], ["censado", "registered (as resident)"], ["hacer leña", "to chop firewood"], ["el lavadero", "public washhouse"], ["animarse a", "to decide to, feel encouraged to"], ["renunciar a", "to give up"]],
  q: [["¿Por qué subía Marcos a la plaza?", ["Para hablar con los vecinos", "Para tener conexión", "Para ir a la tienda"], 1], ["¿Qué solicitó el ayuntamiento gracias a Marcos?", ["Un médico", "Una ayuda para la fibra óptica", "Una tienda nueva"], 1], ["¿Qué ha pasado con la escuela?", ["Ha cerrado", "Ha vuelto a abrir", "Se ha mudado"], 1]] },
{ id: "podcast-b2-1", type: "p", lvl: "b2", t: "El turismo masivo", s: "Café con español · Episode 7",
  l: [[0, "Bienvenidos a Café con español. Hoy abordamos un tema que divide a muchas ciudades: el turismo masivo. Diego, hay vecinos que protestan contra los turistas. ¿Lo entiendes?"],
      [1, "Perfectamente. Cuando los pisos se convierten en apartamentos turísticos, los alquileres suben y los vecinos de toda la vida tienen que irse. No es que la gente odie a los turistas, sino que no puede pagar su casa."],
      [0, "Aun así, el turismo genera mucho empleo. En España supone más del diez por ciento de la economía."],
      [1, "Sí, pero ¿qué tipo de empleo? Muchas veces es temporal y mal pagado. Si se repartieran mejor los beneficios, quizá habría menos rechazo."],
      [0, "Algunas ciudades ya han tomado medidas: limitan las licencias turísticas, cobran una tasa por noche o restringen la llegada de cruceros."],
      [1, "Me parece bien que se regule, siempre que no se perjudique a los pequeños negocios. El bar de la esquina también vive del turismo."],
      [0, "Totalmente. Creo que la clave está en el equilibrio: que la ciudad siga siendo habitable para quienes viven en ella."],
      [1, "Y nosotros, como viajeros, también podemos hacer algo: viajar fuera de temporada, alojarnos en hoteles y consumir en comercios locales."],
      [0, "Fíjense en las estructuras de hoy: no es que más subjuntivo, sino que; si se repartieran, habría; siempre que más subjuntivo. Son típicas del nivel B2."],
      [1, "¿Y en tu ciudad? ¿Hay demasiados turistas? ¡Hasta la próxima!"]],
  gl: [["de toda la vida", "long-standing, lifelong"], ["repartir", "to share out, distribute"], ["el rechazo", "rejection, opposition"], ["la tasa", "tax, fee"], ["perjudicar", "to harm"], ["fuera de temporada", "off-season"]],
  q: [["Según Diego, ¿por qué protestan los vecinos?", ["Odian a los turistas", "No pueden pagar su vivienda", "Hay demasiado ruido"], 1], ["¿Qué medida NO se menciona?", ["Limitar las licencias", "Cobrar una tasa por noche", "Prohibir los vuelos"], 2], ["¿Qué propone Diego a los viajeros?", ["Viajar fuera de temporada", "No viajar nunca", "Viajar solo en crucero"], 0]] },
{ id: "podcast-b2-2", type: "p", lvl: "b2", t: "La IA en el aula", s: "Café con español · Episode 8",
  l: [[1, "Hola a todos. Hoy hablamos de inteligencia artificial y educación. Ana, tú eres profesora: ¿tus alumnos usan la IA para hacer los deberes?"],
      [0, "Por supuesto. Al principio me enfadaba, pero luego me di cuenta de que prohibirla no tenía sentido. Es como cuando aparecieron las calculadoras."],
      [1, "Ya, pero hay una diferencia: la calculadora no escribe la redacción por ti."],
      [0, "Cierto. Por eso he cambiado mis métodos. Ahora les pido que escriban en clase y que luego comparen su texto con el de la IA. Así detectan errores y aprenden a argumentar mejor."],
      [1, "Me parece muy acertado. ¿Y no te preocupa que pierdan la capacidad de pensar por sí mismos?"],
      [0, "Me preocuparía si la usaran sin criterio. Lo importante es que entiendan cómo funciona y que sepan cuándo no fiarse de ella."],
      [1, "Yo, en el restaurante, la uso para traducir el menú y calcular costes. Me ahorra mucho tiempo."],
      [0, "Esa es la cuestión: es una herramienta. Depende de para qué la uses."],
      [1, "¿Y qué recomiendas a los estudiantes de idiomas?"],
      [0, "Que la usen para practicar o pedir explicaciones, pero que no dejen de hablar con personas reales. Un idioma se aprende comunicándose."],
      [1, "Totalmente de acuerdo. ¿Y tú, cómo la usas para aprender español? ¡Hasta pronto!"]],
  gl: [["los deberes", "homework"], ["darse cuenta de", "to realise"], ["la redacción", "essay, composition"], ["acertado", "sensible, spot-on"], ["fiarse de", "to trust"], ["la herramienta", "tool"]],
  q: [["¿Qué hace Ana ahora en clase?", ["Prohíbe la IA", "Pide que comparen su texto con el de la IA", "Ya no pone deberes"], 1], ["¿Para qué usa Diego la IA?", ["Para escribir recetas", "Para traducir el menú y calcular costes", "Para hablar con clientes"], 1], ["¿Qué recomienda Ana a los estudiantes de idiomas?", ["Usar solo la IA", "Seguir hablando con personas reales", "No usar nunca la IA"], 1]] },

{ id: "historia-c1-1", type: "s", lvl: "c1", t: "La traductora", s: "Twenty years of letters with an author",
  p: ["Durante veinte años, Inés tradujo las novelas de un autor noruego al que nunca llegó a conocer en persona. Se escribían largas cartas, primero en papel y después por correo electrónico, en las que discutían, con una minuciosidad casi obsesiva, el peso exacto de cada palabra.",
      "Él solía decirle que sus libros eran mejores en español que en noruego, y ella lo tomaba por una cortesía escandinava. No fue sino hasta después de su muerte cuando descubrió, en una entrevista póstuma, que lo decía en serio: había llegado a reescribir pasajes enteros de sus últimas obras tras leer las versiones de Inés.",
      "La revelación la sumió en una inquietud difícil de explicar. ¿Hasta qué punto aquellos libros seguían siendo de él? ¿Y hasta qué punto se habían convertido, sin que nadie lo supiera, en algo compartido? Por más que releía la correspondencia, no lograba trazar la frontera.",
      "La editorial le propuso entonces publicar las cartas. Inés se negó en un primer momento: le parecía una intromisión, como abrir un cajón ajeno. Sin embargo, acabó aceptando con una condición: que el libro llevara la firma de ambos. «Si de algo me convencieron estos veinte años», escribió en el prólogo, «es de que traducir no consiste en trasladar un texto, sino en conversar con él hasta que ya no sabes quién habla»."],
  gl: [["la minuciosidad", "meticulousness"], ["póstumo", "posthumous"], ["sumir en", "to plunge into"], ["trazar la frontera", "to draw the line"], ["la intromisión", "intrusion"], ["ajeno", "belonging to someone else"]],
  q: [["¿Cómo se comunicaban Inés y el autor?", ["Por teléfono", "Por carta y correo electrónico", "En persona"], 1], ["¿Qué descubrió Inés tras la muerte del autor?", ["Que él había reescrito pasajes tras leer sus traducciones", "Que él hablaba español", "Que él odiaba sus traducciones"], 0], ["¿Qué condición puso para publicar las cartas?", ["Que no apareciera su nombre", "Que el libro llevara la firma de ambos", "Que se tradujera al noruego"], 1]] },
{ id: "historia-c1-2", type: "s", lvl: "c1", t: "El silencio del laboratorio", s: "Why a scientist withdrew her own paper",
  p: ["Nadie en el instituto de investigación entendía por qué la doctora Aguirre había retirado su artículo justo una semana antes de que se publicara. El estudio, que sugería un tratamiento prometedor para una enfermedad degenerativa, había superado la revisión por pares sin apenas objeciones.",
      "Los rumores no tardaron en circular. Unos aseguraban que una farmacéutica la había presionado; otros, que había plagiado parte del trabajo. Ella se limitó a enviar un comunicado escueto: «He detectado un error en el análisis de los datos que invalida las conclusiones».",
      "Lo que no contó es que el error lo había encontrado una becaria de veintitrés años, Nuria, que repasaba las hojas de cálculo por pura curiosidad. Cuando Nuria se lo mostró, temblando, la doctora pasó una noche entera revisando las cifras. Al amanecer, no le cabía duda: la muestra estaba sesgada.",
      "Retirar el artículo le costó una financiación importante y, durante meses, más de un colega le retiró el saludo. Aun así, cuando años después le preguntaron cuál había sido el momento más importante de su carrera, no mencionó ningún premio. «La noche en que una becaria me demostró que estaba equivocada», respondió. «Y que tuvo el valor de decírmelo»."],
  gl: [["la revisión por pares", "peer review"], ["escueto", "brief, terse"], ["la becaria", "intern, research trainee"], ["la hoja de cálculo", "spreadsheet"], ["sesgado", "biased"], ["retirar el saludo", "to stop speaking to someone"]],
  q: [["¿Por qué retiró la doctora el artículo?", ["Por presiones de una farmacéutica", "Porque había un error en los datos", "Porque lo había plagiado"], 1], ["¿Quién encontró el error?", ["Un colega", "Una becaria", "El revisor"], 1], ["¿Qué consecuencia tuvo retirarlo?", ["Recibió un premio", "Perdió financiación", "La ascendieron"], 1]] },
{ id: "podcast-c1-1", type: "p", lvl: "c1", t: "El español en el mundo", s: "Café con español · Episode 9",
  l: [[0, "Bienvenidos a una nueva edición de Café con español. Hoy queremos reflexionar sobre el lugar del español en el mundo. Diego, ¿sabías que es la segunda lengua materna más hablada del planeta?"],
      [1, "Algo había oído, sí. Y, sin embargo, a veces tengo la impresión de que su peso en la ciencia o en internet no se corresponde con el número de hablantes."],
      [0, "Has dado en el clavo. La mayoría de las publicaciones científicas se redactan en inglés, de ahí que muchos investigadores hispanohablantes se vean obligados a publicar en una lengua que no es la suya."],
      [1, "Lo cual, por otra parte, tiene cierta lógica: una lengua común facilita la colaboración internacional."],
      [0, "No lo niego. Ahora bien, cabe preguntarse qué se pierde por el camino: matices, conceptos sin traducción exacta, incluso líneas de investigación que no interesan a otros mercados."],
      [1, "En cualquier caso, el español goza de una vitalidad envidiable en otros ámbitos: la música, las series, el cine."],
      [0, "Sin duda. Y en Estados Unidos hay más de cuarenta millones de personas que lo hablan en casa."],
      [1, "Aunque muchos jóvenes de segunda o tercera generación lo van perdiendo, a no ser que la familia haga un esfuerzo consciente por mantenerlo."],
      [0, "Esa es otra cuestión fascinante: la de las lenguas de herencia. Quizá le dediquemos un episodio entero."],
      [1, "Me parece estupendo. Mientras tanto, os invitamos a reflexionar: ¿qué papel tiene el español en vuestra vida profesional?"],
      [0, "Y fijaos en los conectores de hoy: de ahí que, lo cual, ahora bien, a no ser que. ¡Hasta la próxima!"]],
  gl: [["dar en el clavo", "to hit the nail on the head"], ["redactar", "to write, draft"], ["el matiz", "nuance"], ["gozar de", "to enjoy"], ["la lengua de herencia", "heritage language"]],
  q: [["¿Qué impresión tiene Diego?", ["Que hay pocos hablantes", "Que su peso en ciencia e internet no corresponde al número de hablantes", "Que es difícil de aprender"], 1], ["Según Ana, ¿qué se pierde al publicar siempre en inglés?", ["Dinero", "Matices y conceptos", "Lectores"], 1], ["¿Qué ocurre con muchos jóvenes de segunda generación?", ["Pierden el español si la familia no se esfuerza", "Lo aprenden en la escuela", "Lo hablan mejor que sus padres"], 0]] },
{ id: "podcast-c1-2", type: "p", lvl: "c1", t: "Consumir menos", s: "Café con español · Episode 10",
  l: [[1, "Hola de nuevo. Hoy hablamos de un movimiento que gana adeptos: el consumo responsable. Ana, tú llevas un año sin comprar ropa nueva, ¿no?"],
      [0, "Así es. Empezó como un reto y se ha convertido en una forma de vida. Me di cuenta de que acumulaba prendas que apenas me ponía."],
      [1, "¿Y no lo has echado de menos?"],
      [0, "Al principio, sí. Comprar era casi un acto reflejo cuando estaba aburrida o estresada. Pero, curiosamente, ahora disfruto más de lo que tengo: arreglo, intercambio, compro de segunda mano."],
      [1, "Te admiro, pero me pregunto si estas decisiones individuales sirven de algo frente al modelo de producción global."],
      [0, "Es una objeción razonable. Por sí solas, probablemente no. No obstante, cuando millones de personas cambian sus hábitos, las empresas se ven obligadas a adaptarse."],
      [1, "Siempre y cuando no se limiten a hacer marketing verde, claro."],
      [0, "Por supuesto. El llamado ecoblanqueo es un riesgo real. Por eso conviene informarse y desconfiar de las etiquetas grandilocuentes."],
      [1, "Yo he empezado por la cocina: aprovechamos las sobras y compramos directamente a productores locales. Hemos reducido el desperdicio a la mitad."],
      [0, "¡Qué bien! Lo cual demuestra que se puede empezar por cosas pequeñas."],
      [1, "¿Y vosotros? ¿Os animaríais a pasar un año sin comprar algo? ¡Hasta pronto!"]],
  gl: [["ganar adeptos", "to gain followers"], ["la prenda", "garment"], ["de segunda mano", "second-hand"], ["el ecoblanqueo", "greenwashing"], ["grandilocuente", "grandiose"], ["las sobras", "leftovers"]],
  q: [["¿Qué reto hizo Ana?", ["Un año sin redes sociales", "Un año sin comprar ropa nueva", "Un año sin coche"], 1], ["¿Qué objeción plantea Diego?", ["Que es caro", "Que las decisiones individuales quizá no basten", "Que la ropa usada es peor"], 1], ["¿Qué ha conseguido Diego en el restaurante?", ["Reducir el desperdicio a la mitad", "Abrir otro local", "Cambiar el menú"], 0]] },

/* ---------------- C2 ---------------- */
{ id: "historia-c2-1", type: "s", lvl: "c2", t: "Palabras prestadas", s: "A grandfather who collected words",
  p: ["Mi abuelo, que apenas fue a la escuela, tenía la costumbre de apropiarse de las palabras que oía en la radio. Las guardaba como quien colecciona monedas antiguas y las sacaba a relucir en los momentos más insospechados: llamaba «coyuntura» al tiempo que hacía en la vega e «idiosincrasia» a las manías de las cabras.",
      "De niño me avergonzaba un poco. Me parecía que aquellas palabras le quedaban grandes, como un traje heredado. Tardé años en comprender que no las usaba para aparentar, sino por puro placer: le gustaba cómo sonaban, el modo en que una palabra culta convertía lo cotidiano en algo digno de ser nombrado con solemnidad.",
      "Cuando murió, encontré en su mesilla una libreta de tapas gastadas. En ella había anotado, con letra temblorosa, cientos de palabras acompañadas de definiciones inventadas, muchas de ellas disparatadas, otras de una lucidez desconcertante. Junto a «nostalgia», por ejemplo, había escrito: «Lo que pesa un sitio cuando ya no estás en él».",
      "Ningún diccionario que yo conozca lo ha dicho mejor. A veces pienso que mi oficio de lexicógrafa no es más que una versión ordenada, y bastante menos poética, de aquella libreta. Habida cuenta de todo, quizá la lengua no pertenezca a quienes la estudian, sino a quienes se atreven a tomarla prestada sin pedir permiso."],
  gl: [["sacar a relucir", "to bring out, show off"], ["la vega", "fertile river plain"], ["quedarle grande algo a alguien", "to be too big for someone"], ["aparentar", "to show off, keep up appearances"], ["disparatado", "absurd"], ["la lexicógrafa", "dictionary writer"]],
  q: [["¿Qué hacía el abuelo con las palabras de la radio?", ["Las corregía", "Las coleccionaba y las usaba", "Las olvidaba"], 1], ["Según la narradora, ¿por qué las usaba?", ["Para aparentar", "Por puro placer", "Por su trabajo"], 1], ["¿Qué profesión tiene la narradora?", ["Periodista", "Lexicógrafa", "Maestra"], 1]] },
{ id: "historia-c2-2", type: "s", lvl: "c2", t: "La última función", s: "The final night of an old theatre",
  p: ["El teatro Real Cinema, que ni era real ni proyectaba películas desde hacía décadas, cerraba sus puertas tras ciento doce años de historia. El ayuntamiento lo había vendido a una cadena hotelera y, so pena de incurrir en una sanción millonaria, la compañía residente debía desalojar el edificio antes de fin de mes.",
      "Para la última función, el director, un hombre de ochenta años curtido en mil batallas burocráticas, eligió una obra que nadie esperaba: una comedia ligera, casi frívola, que se había estrenado en ese mismo escenario en 1931. «Las despedidas solemnes son para los entierros», zanjó cuando los actores le pidieron algo más trascendente.",
      "Aquella noche el público rio como hacía años que no reía. Hubo quien se presentó con fotografías de sus abuelos sentados en las mismas butacas; hubo quien, con el pretexto de ir al baño, se paseó por los pasillos para despedirse de cada rincón. Al caer el telón, nadie se levantó. Durante casi diez minutos, la sala permaneció en un silencio que fue, a la postre, el aplauso más elocuente.",
      "Al día siguiente, una plataforma vecinal presentó un recurso para que el edificio fuera declarado bien de interés cultural. Nadie apuesta a que prospere. Pero el director, cuando se le pregunta, se limita a sonreír: «Los teatros no mueren cuando se cierran, sino cuando dejan de recordarse»."],

{ id: "podcast-c2-1", type: "p", lvl: "c2", t: "Hablar bien, ¿para quién?", s: "Café con español · Episode 11",
  l: [[0, "Bienvenidos a Café con español. Hoy nos adentramos en un terreno resbaladizo: la corrección lingüística. Diego, ¿alguna vez te han corregido por tu manera de hablar?"],
      [1, "Más veces de las que me gustaría recordar. Cuando llegué a Madrid, un compañero se empeñaba en corregirme cada vez que decía ahorita o platicar, como si fueran errores y no variantes perfectamente legítimas."],
      [0, "Ahí está el quid de la cuestión: confundir la norma de una variedad concreta con la norma del idioma en su conjunto."],
      [1, "Exacto. Y no es una cuestión meramente lingüística; tiene que ver con el prestigio, con quién tiene la autoridad para decidir qué es hablar bien."],
      [0, "Ahora bien, no conviene caer en el extremo opuesto. La norma culta cumple una función: garantiza la intercomprensión entre cientos de millones de hablantes."],
      [1, "Sin duda. Pero esa norma, hoy en día, es policéntrica: no hay un único modelo, sino varios igualmente válidos."],
      [0, "Lo cual no siempre se refleja en las aulas, ni en los medios, ni en los exámenes."],

      [0, "Un dato que nuestros oyentes agradecerán. Para cerrar, os propongo un ejercicio: escuchad a hablantes de tres países distintos y anotad las diferencias de léxico y entonación que percibáis."],

{ id: "podcast-c2-2", type: "p", lvl: "c2", t: "La memoria de los objetos", s: "Café con español · Episode 12",
  l: [[1, "Hola, queridos oyentes. Hoy os proponemos una conversación algo distinta: ¿por qué nos cuesta tanto desprendernos de ciertos objetos?"],
      [0, "Yo conservo un abrecartas de mi abuela que no he usado jamás. Objetivamente, es un trasto. Y, sin embargo, deshacerme de él sería como traicionarla."],
      [1, "Es curioso cómo un objeto puede convertirse en depositario de la memoria. Hay quien sostiene que no recordamos a las personas, sino que son las cosas las que nos las recuerdan."],
      [0, "Me atrevería a decir que es una relación recíproca: el objeto activa el recuerdo, pero el recuerdo, a su vez, carga el objeto de un significado que nadie más percibe."],
      [1, "De ahí, supongo, el desconcierto que sentimos al vaciar la casa de un familiar: lo que para nosotros es un tesoro, para quien viene a recogerlo es mercancía."],
      [0, "Hay una paradoja en nuestra época: nunca habíamos tenido tantas cosas y, a la vez, nunca nos habían parecido tan reemplazables."],
      [1, "Quizá porque lo que se fabrica para durar poco difícilmente acumula historia."],
      [0, "Habida cuenta de ello, uno se pregunta qué objetos de hoy conservarán nuestros nietos. ¿Un teléfono móvil? Lo dudo."],
      [1, "A lo mejor heredan nuestras fotos digitales, siempre y cuando alguien se acuerde de la contraseña."],
      [0, "Tremenda ironía. Os dejamos con la pregunta: ¿qué objeto salvaríais de un incendio y por qué? Hasta la próxima."]],

<script>
(function () {

      '<section class="block"><div class="shead"><h2>How each unit works</h2></div><ol class="steps"><li><b>Listen</b><span>Tap the speaker to hear every word.</span></li><li><b>Learn</b><span>Grammar tables with the key rules.</span></li><li><b>Practise</b><span>Type your answers and check them.</span></li><li><b>Review</b><span>Flashcards for the whole level.</span></li><li><b>Test</b><span>Exam guide and a timed-style mock.</span></li></ol></section>' +
      '<section class="block"><div class="shead"><h2>Levels</h2><span class="muted">Progress is saved in this browser</span></div><div class="levels">' + cards + "</div></section>" +
      '<section class="block"><div class="shead"><h2>Use it like an app</h2></div><div class="callout"><p><b>iPhone:</b> open this page in Safari, tap the Share button, then <b>Add to Home Screen</b>.</p><p style="margin-top:6px"><b>Android:</b> open it in Chrome, tap the ⋮ menu, then <b>Add to Home screen</b>.</p><p style="margin-top:6px" class="muted">The icon opens Ruta DELE full screen. You need an internet connection, and progress is saved separately on each device.</p></div></section></div>';
  }

  function levelHead(L, tab) {
    const p = levelPct(L.id);
    const tabs = [["", "Units"], ["-cards", "Flashcards"], ["-exam", "Exam guide"], ["-mock", "Mock test"]].map(([h, n]) => '<a href="#' + L.id + h + '"' + (tab === h ? ' aria-current="page"' : "") + ">" + n + "</a>").join("");
    return '<p class="crumbs"><a href="#inicio">Ruta DELE</a><span aria-hidden="true">›</span><span>' + L.name + "</span></p>" +
      '<div class="lhead"><div class="badge tiles"><b>' + L.name + "</b></div><div><p class=\"eyebrow\">Nivel " + L.name + " · " + esc(L.lang) + "</p><h1>" + esc(L.label) + '</h1><p style="margin-top:6px;max-width:60ch">' + esc(L.desc) + '</p><div class="row" style="margin-top:10px"><div class="bar" style="width:180px"><i style="width:' + p + '%"></i></div><span class="muted">' + p + "% of units done</span></div></div></div>" +
      '<nav class="tabs" aria-label="Level sections">' + tabs + "</nav>";
  }

  function level(L) {
    const rows = L.units.map((u, i) => {
      const st = unitState(L.id, i);
      const pill = st.done ? '<span class="pill ok">Done ✓</span>' : st.best != null ? '<span class="pill prog">' + st.best + " / " + u.x.length + "</span>" : '<span class="pill new">New</span>';
      return '<li><a href="#' + L.id + "-u" + (i + 1) + '"><span class="n">' + (i + 1) + '</span><span class="t">' + esc(u.t) + "<small>" + esc(u.s) + "</small></span>" + pill + "</a></li>";
    }).join("");
    app.innerHTML = '<div class="stack">' + levelHead(L, "") + '<ol class="ulist">' + rows + "</ol>" +
      '<p class="callout">A unit is marked done when you score 6 or more out of 8 in its practice, or when you mark it done yourself.</p></div>';
  }

  function vocabGroup(g) {
    const h = g.h || ["Español", "English"];
    return '<div class="gblock"><h3>' + esc(g.t) + '</h3><div class="tbl"><table class="vocab"><thead><tr><th></th><th>' + esc(h[0]) + "</th><th>" + esc(h[1]) + "</th></tr></thead><tbody>" +
      g.w.map((w) => '<tr><td class="sp">' + sayBtn(w[0]) + '</td><td class="es">' + esc(w[0]) + '</td><td class="en"><span data-act="reveal">' + esc(w[1]) + "</span></td></tr>").join("") + "</tbody></table></div></div>";
  }
  function grammarBlock(g) {
    return '<div class="gblock"><h3>' + esc(g.t) + "</h3>" + (g.r ? '<p class="rule">' + esc(g.r) + "</p>" : "") +
      '<div class="tbl"><table><thead><tr>' + g.h.map((x) => "<th>" + esc(x) + "</th>").join("") + "</tr></thead><tbody>" +
      g.rows.map((r) => "<tr>" + r.map((c) => "<td>" + esc(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table></div>" +
      (g.n ? '<ul class="notes">' + g.n.map((n) => "<li>" + rich(n) + "</li>").join("") + "</ul>" : "") + "</div>";
  }
  function mcList(qs, scope) {
    return '<ol class="mc" data-scope="' + scope + '">' + qs.map((q, i) => '<li><p class="mq">' + blanks(q[0]) + '</p><div class="opts">' + q[1].map((o, j) => '<button class="opt" data-act="mc" data-q="' + i + '" data-o="' + j + '">' + esc(o) + "</button>").join("") + "</div></li>").join("") + "</ol>";
  }

  function unit(L, i) {
    const u = L.units[i];
    S.last = { l: L.id, i }; save();
    const st = unitState(L.id, i);
    const has = { d: !!u.d, r: !!u.r };
    const jump = [["voc", "Vocabulario"], ["gra", "Gramática"]].concat(has.d ? [["dia", "Diálogo"]] : []).concat(has.r ? [["lec", "Lectura"]] : []).concat([["pra", "Práctica"]]);
    let h = '<div class="stack"><p class="crumbs"><a href="#inicio">Ruta DELE</a><span aria-hidden="true">›</span><a href="#' + L.id + '">' + L.name + '</a><span aria-hidden="true">›</span><span>Unidad ' + (i + 1) + "</span></p>" +
      '<div><p class="eyebrow">' + L.name + " · Unidad " + (i + 1) + " of " + L.units.length + "</p><h1>" + esc(u.t) + '</h1><p class="muted" style="font-size:1.15rem;margin-top:6px">' + esc(u.s) + "</p></div>" +
      '<div class="jump">' + jump.map(([id, n]) => '<button class="btn small" data-act="jump" data-to="' + id + '">' + n + "</button>").join("") + "</div>";
    h += '<section class="block" id="s-voc"><div class="shead"><h2>Vocabulario</h2><button class="btn small" data-act="hide-en" aria-pressed="false">Hide translations to test yourself</button></div>' + u.v.map(vocabGroup).join("") + "</section>";
    h += '<section class="block" id="s-gra"><div class="shead"><h2>Gramática</h2></div>' + u.g.map(grammarBlock).join("") + "</section>";
    if (has.d) h += '<section class="block" id="s-dia"><div class="shead"><h2>Diálogo</h2><button class="btn small tts-only" data-act="play-dlg">Play the whole dialogue</button></div><p class="muted">' + esc(u.d.c) + ' Read it aloud, then swap roles.</p><div class="dlg">' + u.d.l.map((l, k) => '<div class="line' + (k % 2 ? " b" : "") + '">' + sayBtn(l[1]) + '<p><span class="who">' + esc(l[0]) + ":</span> " + esc(l[1]) + '<span class="tr">' + esc(l[2]) + "</span></p></div>").join("") + "</div></section>";
    if (has.r) h += '<section class="block" id="s-lec"><div class="shead"><h2>Lectura</h2></div><p class="muted">' + esc(u.r.c) + '</p><div class="passage"><div class="row" style="margin-bottom:8px">' + sayBtn(u.r.text, "the text") + '<span class="muted">Listen to the text</span></div>' + esc(u.r.text) + "</div>" + mcList(u.r.q, "read") + "</section>";
    h += '<section class="block" id="s-pra"><div class="shead"><h2>Práctica</h2>' + (st.best != null ? '<span class="muted">Best: ' + st.best + " / " + u.x.length + "</span>" : "") + '</div><p class="muted">' + esc(u.xi) + '</p><form id="exf" autocomplete="off"><ol class="ex">' +
      u.x.map((x, k) => '<li><label class="q" for="ex-' + k + '">' + blanks(x[0]) + '</label><input id="ex-' + k + '" data-k="' + k + '" spellcheck="false" autocapitalize="off"><span class="fb" id="fb-' + k + '" aria-live="polite"></span></li>').join("") +
      '</ol><div class="row" style="margin-top:16px"><button class="btn primary" type="submit">Check answers</button><button class="btn" type="button" data-act="show-ans">Show answers</button><button class="btn" type="button" data-act="reset-ex">Clear</button><span class="result" id="res" aria-live="polite"></span></div></form></section>';
    const prev = i > 0 ? '<a class="btn" href="#' + L.id + "-u" + i + '">‹ ' + esc(L.units[i - 1].t) + "</a>" : '<a class="btn" href="#' + L.id + '">‹ All units</a>';
    const next = i < L.units.length - 1 ? '<a class="btn" href="#' + L.id + "-u" + (i + 2) + '">' + esc(L.units[i + 1].t) + " ›</a>" : '<a class="btn" href="#' + L.id + '-exam">Exam guide ›</a>';
    h += '<div class="unav">' + prev + '<button class="btn" data-act="toggle-done" aria-pressed="' + (st.done ? "true" : "false") + '">' + (st.done ? "Done ✓" : "Mark as done") + "</button>" + next + "</div></div>";
    app.innerHTML = h;

    const form = document.getElementById("exf");
    form.addEventListener("submit", (e) => { e.preventDefault(); check(L, i, false); });
  }

  /* ---------- checking ---------- */
  const norm = (s) => String(s).toLowerCase().normalize("NFC").replace(/[¿?¡!.,;:«»"“”()…]/g, " ").replace(/\s+/g, " ").trim();
  const strip = (s) => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
  function check(L, i, reveal) {
    const u = L.units[i]; let score = 0;
    u.x.forEach((x, k) => {
      const inp = document.getElementById("ex-" + k), fb = document.getElementById("fb-" + k);
      const alts = x[1].split("|"); const main = alts[0];
      inp.classList.remove("ok", "no", "near"); fb.className = "fb";
      if (reveal) { inp.value = main; fb.textContent = ""; return; }
      const v = norm(inp.value);
      if (!v) { inp.classList.add("no"); fb.classList.add("no"); fb.textContent = "Answer: " + main; return; }
      if (alts.some((a) => norm(a) === v)) { score++; inp.classList.add("ok"); fb.classList.add("ok"); fb.textContent = "Correct"; }
      else if (alts.some((a) => strip(norm(a)) === strip(v))) { inp.classList.add("near"); fb.classList.add("near"); fb.textContent = "Almost: check the accents → " + main; }
      else { inp.classList.add("no"); fb.classList.add("no"); fb.textContent = "Answer: " + main; }
    });
    if (reveal) { document.getElementById("res").textContent = ""; return; }
    const k = uKey(L.id, i); const st = S.u[k] || {};
    st.best = Math.max(st.best || 0, score);
    const pass = score >= Math.ceil(u.x.length * 0.75);
    if (pass) st.done = true;
    S.u[k] = st; save(); navChips(L.id);
    document.getElementById("res").textContent = score + " / " + u.x.length + (pass ? " · Unit done ✓" : " · Aim for " + Math.ceil(u.x.length * 0.75) + " to complete the unit");
    const tg = app.querySelector('[data-act="toggle-done"]'); if (tg && st.done) { tg.textContent = "Done ✓"; tg.setAttribute("aria-pressed", "true"); }
  }

  /* ---------- flashcards ---------- */
  let FC = null;
  function cardsView(L) {
    const all = [];
    L.units.forEach((u, ui) => u.v.forEach((g, gi) => g.w.forEach((w, wi) => all.push({ id: ui + "." + gi + "." + wi, ui, es: w[0], en: w[1] }))));
    const known = new Set(S.k[L.id] || []);
    if (!FC || FC.l !== L.id) FC = { l: L.id, unit: "all", rev: false, onlyNew: true, pos: 0, flipped: false, order: null, armReset: false };
    const pool = all.filter((c) => (FC.unit === "all" || String(c.ui) === FC.unit) && (!FC.onlyNew || !known.has(c.id)));
    if (!FC.order || FC.order.length !== pool.length || FC.order.some((id) => !pool.find((c) => c.id === id))) { FC.order = pool.map((c) => c.id); FC.pos = 0; }
    const deck = FC.order.map((id) => pool.find((c) => c.id === id)).filter(Boolean);
    const cur = deck[FC.pos % Math.max(1, deck.length)];
    const scopeAll = all.filter((c) => FC.unit === "all" || String(c.ui) === FC.unit);
    const nKnown = scopeAll.filter((c) => known.has(c.id)).length;
    const opts = '<option value="all">All units</option>' + L.units.map((u, i) => '<option value="' + i + '"' + (FC.unit === String(i) ? " selected" : "") + ">" + (i + 1) + ". " + esc(u.t) + "</option>").join("");
    let card;
    if (!cur) card = '<div class="fc" style="cursor:default"><div><p class="face">¡Todo aprendido!</p><p class="muted" style="margin-top:8px">You marked every card in this set as known. Show all cards to review them again.</p></div></div>';
    else {
      const front = FC.rev ? cur.en : cur.es, back = FC.rev ? cur.es : cur.en;
      card = '<div class="fc' + (FC.flipped ? " flipped" : "") + '" data-act="flip" role="button" tabindex="0" aria-label="Flashcard. Tap to turn over.">' + sayBtn(cur.es) + '<p class="face">' + esc(FC.flipped ? back : front) + '</p><span class="hint">' + (FC.flipped ? "Did you know it?" : "Tap the card to see the answer") + "</span></div>";
    }
    app.innerHTML = '<div class="stack">' + levelHead(L, "-cards") +
      '<div class="fc-tools"><label for="fc-unit" class="muted">Set</label><select id="fc-unit" data-act="fc-unit">' + opts + "</select>" +
      '<button class="btn small" data-act="fc-rev" aria-pressed="' + FC.rev + '">' + (FC.rev ? "English → Español" : "Español → English") + "</button>" +
      '<button class="btn small" data-act="fc-new" aria-pressed="' + FC.onlyNew + '">' + (FC.onlyNew ? "Showing cards to learn" : "Showing all cards") + "</button>" +
      '<button class="btn small" data-act="fc-shuffle">Shuffle</button></div>' +
      '<div class="fc-wrap">' + card +
      (cur ? '<div class="row" style="justify-content:center"><button class="btn" data-act="fc-again">Again</button><button class="btn primary" data-act="fc-know">I know it</button></div>' : "") +
      '<p class="muted" style="font-variant-numeric:tabular-nums">' + nKnown + " of " + scopeAll.length + " known" + (cur ? " · card " + ((FC.pos % deck.length) + 1) + " of " + deck.length : "") + "</p>" +
      '<button class="btn small" data-act="fc-reset">' + (FC.armReset ? "Tap again to clear known cards" : "Clear known cards for this level") + "</button></div></div>";
    FC.cur = cur;
  }

  /* ---------- exam & mock ---------- */
  function exam(L) {
    const E = L.exam;
    const tests = E.tests.map((t) => '<article class="test"><div><p class="eyebrow">' + esc(t.en) + "</p><h3>" + esc(t.n) + '</h3></div><div class="tmeta"><span class="pill prog">' + esc(t.min) + '</span><span class="pill new">' + esc(t.tasks) + "</span></div><h4>What’s in it</h4><ul class=\"notes\">" + t.what.map((w) => "<li>" + rich(w) + "</li>").join("") + "</ul><h4>Strategies</h4><ul class=\"notes\">" + t.tips.map((w) => "<li>" + esc(w) + "</li>").join("") + "</ul></article>").join("");
    const models = E.models.map((m) => '<div class="gblock"><h3>Model answer · ' + esc(m.k) + '</h3><div class="model"><div class="task"><strong>Task:</strong> ' + esc(m.task) + '</div><div class="mtext"><div class="row" style="margin-bottom:8px">' + sayBtn(m.text, "the model answer") + '<span class="muted">Listen to the model</span></div>' + esc(m.text) + '</div><div><h4 class="eyebrow" style="margin-bottom:8px">Why it works</h4><ul class="notes">' + m.notes.map((n) => "<li>" + esc(n) + "</li>").join("") + "</ul></div></div></div>").join("");
    app.innerHTML = '<div class="stack">' + levelHead(L, "-exam") +
      '<div class="ebar"><div><span class="muted">Total time</span><b>' + esc(E.total) + '</b></div><div><span class="muted">To pass</span><b>' + esc(E.pass) + '</b></div><div><span class="muted">Groups</span>' + E.groups.map((g) => "<p>" + esc(g) + "</p>").join("") + "</div></div>" +
      '<section class="block"><div class="shead"><h2>The tests</h2></div><div class="tests">' + tests + "</div></section>" +
      '<section class="block"><div class="shead"><h2>Model answers</h2></div>' + models + "</section>" +
      '<p class="callout">The Instituto Cervantes revises exam formats from time to time. Before you register, check the current format and download the free official model exams (with audio) at <a href="https://examenes.cervantes.es/" target="_blank" rel="noopener">examenes.cervantes.es</a>.</p></div>';
  }
  function mock(L) {
    const best = S.m[L.id];
    app.innerHTML = '<div class="stack">' + levelHead(L, "-mock") +
      '<div class="row" style="justify-content:space-between"><p class="muted">Mixed review of every unit in ' + L.name + ". Choose one answer per question. Aim for 8 of 10.</p>" + (best != null ? '<span class="pill ok">Best: ' + best + " / " + L.mock.length + "</span>" : "") + "</div>" +
      mcList(L.mock, "mock") +
      '<div class="row"><span class="result" id="mres" aria-live="polite"></span><button class="btn" data-act="mock-reset">Try again</button></div></div>';
  }

  /* ================= LISTENING + WORDS ================= */
  S.l = S.l || {}; S.w = S.w || {};
  const LI = Object.fromEntries(LISTEN.map((x) => [x.id, x]));
  const LVNAMES = COURSE.map((l) => l.id);

  function setSec(sec) {
    document.body.dataset.sec = sec;
    document.querySelectorAll(".secnav a, .tabbar a").forEach((a) => a.setAttribute("aria-current", a.dataset.s === sec ? "page" : "false"));
  }

  /* ---------- two Spanish voices for podcasts ---------- */
  let V2 = [null, null];
  function pickVoices() {
    try {
      const vs = speechSynthesis.getVoices().filter((v) => /^es/i.test(v.lang));
      const a = vs.find((v) => /^es[-_]ES/i.test(v.lang)) || vs[0] || null;
      const b = vs.find((v) => v !== a && /^es[-_](MX|US|419|CO|AR|CL|PE)/i.test(v.lang)) || vs.find((v) => v !== a) || null;
      V2 = [a, b];
    } catch (e) {}
  }
  if (canSpeak) { pickVoices(); speechSynthesis.onvoiceschanged = () => { pickVoice(); pickVoices(); }; }

  /* ---------- sentence player ---------- */
  const PL = { items: [], i: 0, playing: false, rate: 0.9, cur: null, single: false, id: null, follow: true };
  const PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>';
  const PAUSE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>';
  const PREV = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg>';
  const NEXT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg>';
  function plUI() {
    document.querySelectorAll("[data-pi]").forEach((el) => el.classList.toggle("playing", PL.playing && +el.dataset.pi === PL.i));
    const b = document.getElementById("pl-play");
    if (b) { b.innerHTML = PL.playing ? PAUSE : PLAY; b.setAttribute("aria-label", PL.playing ? "Pause" : "Play"); }
    const c = document.getElementById("pl-pos"); if (c) c.textContent = (PL.i + 1) + " / " + PL.items.length;
    if (PL.playing && PL.follow) { const el = document.querySelector('[data-pi="' + PL.i + '"]'); if (el && el.scrollIntoView) { const r = el.getBoundingClientRect(); if (r.top < 90 || r.bottom > innerHeight - 160) el.scrollIntoView({ block: "center", behavior: "smooth" }); } }
  }
  function plSpeak() {
    const it = PL.items[PL.i]; if (!it) { plStop(); return; }
    const u = new SpeechSynthesisUtterance(it.text);
    if (it.voice) { u.voice = it.voice; u.lang = it.voice.lang; } else u.lang = "es-ES";
    u.rate = PL.rate; u.pitch = it.pitch || 1;
    u.onend = () => {
      if (!PL.playing || PL.cur !== u) return;
      if (PL.single) { PL.playing = false; PL.single = false; plUI(); return; }
      PL.i++;
      if (PL.i < PL.items.length) plSpeak();
      else { PL.playing = false; PL.i = 0; const st = S.l[PL.id] || {}; st.heard = true; S.l[PL.id] = st; save(); plUI(); }
    };
    PL.cur = u;
    try { speechSynthesis.speak(u); } catch (e) {}
    plUI();
  }
  function plPlay(single) { if (!canSpeak) return; try { speechSynthesis.cancel(); } catch (e) {} PL.playing = true; PL.single = !!single; plSpeak(); }
  function plStop() { PL.playing = false; PL.cur = null; try { if (canSpeak) speechSynthesis.cancel(); } catch (e) {} plUI(); }
  function plJump(n) { PL.i = Math.max(0, Math.min(PL.items.length - 1, n)); if (PL.playing) { PL.cur = null; try { speechSynthesis.cancel(); } catch (e) {} plSpeak(); } else plUI(); }
  function playerBar(hasEn) {
    return '<div class="player" role="group" aria-label="Audio player">' +
      '<button class="pbtn" data-act="l-prev" aria-label="Previous sentence">' + PREV + '</button>' +
      '<button class="pbtn main" id="pl-play" data-act="l-play" aria-label="Play">' + PLAY + '</button>' +
      '<button class="pbtn" data-act="l-next" aria-label="Next sentence">' + NEXT + '</button>' +
      '<span class="ppos" id="pl-pos">1 / ' + PL.items.length + '</span>' +
      '<label class="sr" for="pl-rate">Speed</label><select id="pl-rate" aria-label="Speed">' + [[0.7, "0.7×"], [0.85, "0.85×"], [0.9, "0.9×"], [1, "1×"], [1.1, "1.1×"]].map(([v, n]) => '<option value="' + v + '"' + (v === PL.rate ? " selected" : "") + ">" + n + "</option>").join("") + "</select>" +
      '<button class="btn small" data-act="l-text" aria-pressed="false" id="l-text">Hide text</button>' +
      (hasEn ? '<button class="btn small" data-act="l-en" aria-pressed="false" id="l-en">Translation</button>' : "") + "</div>";
  }

  /* ---------- text helpers ---------- */
  function splitSents(p) {
    const out = []; let start = 0;
    for (let i = 0; i < p.length; i++) {
      const ch = p[i];
      if (".!?…".includes(ch)) {

  const WRE = /([A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+)/;

  }
  function dictationSents(x) {
    const all = x.type === "s" ? x.p.flatMap(splitSents) : x.l.flatMap((l) => splitSents(l[1]));
    const ok = all.filter((s) => { const n = nwords(s); return n >= 4 && n <= 13 && !/[«»—]/.test(s); });

  function lcsMark(target, guess) {
