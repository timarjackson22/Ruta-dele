name: wordbank
# Spanish word bank from Wiktionary (kaikki.org, CC BY-SA): expressions, slang and regional words, plus a coverage report. tools/WORDBANK_BRIEF.md
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          curl -sSL -o es.jsonl.gz https://kaikki.org/dictionary/Spanish/kaikki.org-dictionary-Spanish.jsonl.gz
          gzip -t es.jsonl.gz; ls -l es.jsonl.gz
          python3 tools/wordbank.py es.jsonl.gz out
          ls -l out
      - name: save the bank on the wordbank-data branch (the app's build copies it in)
        run: |
          git config user.name "wordbank bot"; git config user.email "actions@github.com"
          git checkout --orphan wordbank-data; git rm -rq --cached . ; mkdir -p wb; cp out/* wb/
          git add wb; git commit -qm "word bank $(date -u +%F)"; git push -fq origin wordbank-data
