name: Profe eval

on:
  workflow_dispatch:
    inputs:
      model:
        description: "smart (1.5B), fast (0.5B) or gemma4 (Gemma 4 E2B, LiteRT-LM)"
        default: smart
      suite:
        description: "chat (32 conversations) or writing (grader check)"
        default: chat

permissions:
  contents: write

jobs:
  eval:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
      SHARDS: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pick model
        run: |
          if [ "${{ inputs.model }}" = "gemma4" ]; then
            echo "REPO=litert-community/gemma-4-E2B-it-litert-lm" >> $GITHUB_ENV; echo "FILE=gemma-4-E2B-it.litertlm" >> $GITHUB_ENV
            echo "MODEL_NAME=gemma-4-E2B-it.litertlm" >> $GITHUB_ENV
          elif [ "${{ inputs.model }}" = "fast" ]; then
            echo "REPO=Qwen/Qwen2.5-0.5B-Instruct-GGUF" >> $GITHUB_ENV; echo "FILE=qwen2.5-0.5b-instruct-q8_0.gguf" >> $GITHUB_ENV
            echo "MODEL_NAME=Qwen2.5-0.5B-Instruct_multi-prefill-seq_q8_ekv1280.task" >> $GITHUB_ENV
          else
            echo "REPO=Qwen/Qwen2.5-1.5B-Instruct-GGUF" >> $GITHUB_ENV; echo "FILE=qwen2.5-1.5b-instruct-q8_0.gguf" >> $GITHUB_ENV
            echo "MODEL_NAME=Qwen2.5-1.5B-Instruct_multi-prefill-seq_q8_ekv4096.task" >> $GITHUB_ENV
          fi
      - uses: actions/cache@v4
        with:
          path: models
          key: gguf-${{ env.FILE }}
      - uses: actions/setup-java@v5
        if: inputs.model == 'gemma4'
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        if: inputs.model == 'gemma4'
        with:
          gradle-version: "8.11.1"
      - name: Build the LiteRT-LM test server
        if: inputs.model == 'gemma4'
        run: cd eval/lm && gradle --no-daemon -q installDist
      - name: Install
        run: |
          pip install -q huggingface_hub
          pip install -q llama-cpp-python==0.3.16 --prefer-binary --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
          cd eval && npm init -y >/dev/null && npm i -s playwright@1.55.0 && (npx playwright install chromium >/dev/null || npx playwright install --with-deps chromium >/dev/null)
      - name: Download model
        run: test -f models/$FILE || python3 -c "import os;from huggingface_hub import hf_hub_download as d;d(os.environ['REPO'],os.environ['FILE'],local_dir='models')"
      - name: Run
        run: |
          mkdir -p eval/out
          python3 -m http.server 8766 --bind 127.0.0.1 >/dev/null 2>&1 &
          if [ "${{ inputs.model }}" = "gemma4" ]; then RAW_LOG=eval/out/raw-$SHARD.jsonl eval/lm/build/install/lm/bin/lm models/$FILE > server.log 2>&1 & else python3 eval/server.py models/$FILE eval/out/raw-$SHARD.jsonl > server.log 2>&1 & fi
          for i in $(seq 1 300); do grep -q "model loaded" server.log && break; sleep 2; done; cat server.log
          grep -q "model loaded" server.log || { echo "the model server did not start"; exit 1; }
          if [ "${{ inputs.suite }}" = "writing" ]; then if [ "$SHARD" = "0" ]; then cd eval && OUT=out node writing.js; fi; else cd eval && OUT=out node run.js; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-${{ matrix.shard }}
          path: eval/out
  report:
    needs: eval
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - name: Report
        env:
          MODEL_NAME: ${{ inputs.model }}
        run: if [ "${{ inputs.suite }}" = "writing" ]; then cat all/summary.json; else node eval/report.js all && cat all/summary.json; fi
      - name: Save results to the eval-results branch
        run: |
          cd all && git init -q && git checkout -q -b eval-results-${{ github.ref_name }}-${{ inputs.model }}${{ inputs.suite == 'writing' && '-writing' || '' }}
          git config user.name "profe-eval" && git config user.email "actions@users.noreply.github.com"
          git add report.md summary.json results-*.json raw-*.jsonl 2>/dev/null; git commit -qm "eval ${{ github.run_id }}"
          git push -qf https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git eval-results-${{ github.ref_name }}-${{ inputs.model }}${{ inputs.suite == 'writing' && '-writing' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            all/report.md
            all/summary.json
            all/results-*.json
            all/raw-*.jsonl
